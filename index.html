<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Journey Home Japan / 日本帰宅ゲーム</title>
<link rel="stylesheet" href="lib/leaflet/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="map"></div>

<div id="hud">
  <div id="hud-inner">
    <div class="hud-title">帰宅ゲーム</div>
    <div class="hud-stat">
      <span class="label">目的地まで(直線)</span>
      <span class="value" id="stat-distance">-- km</span>
    </div>
    <div class="hud-stat">
      <span class="label">所持金</span>
      <span class="value" id="stat-money">¥0</span>
    </div>
    <div class="hud-stat">
      <span class="label">プレイ時間</span>
      <span class="value" id="stat-time">00:00</span>
    </div>
    <div class="hud-stat">
      <span class="label">空腹</span>
      <div class="gauge-wrap"><div class="gauge-bg"><div class="gauge-fill hunger" id="gauge-hunger" style="width:100%"></div></div></div>
    </div>
    <div class="hud-stat">
      <span class="label">体力</span>
      <div class="gauge-wrap"><div class="gauge-bg"><div class="gauge-fill stamina" id="gauge-stamina" style="width:100%"></div></div></div>
    </div>
    <div class="hud-actions">
      <button class="hud-btn" id="btn-eat">食事 ¥300</button>
      <button class="hud-btn" id="btn-rest">休憩 ¥150</button>
      <button class="hud-btn" id="btn-work">アルバイト</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<button id="fab-reset">最初からやり直す</button>

<div id="candidate-panel" class="hidden">
  <h3>次にどこへ行く？(候補は上位のみ表示)</h3>
  <div id="candidate-list"></div>
</div>

<div id="overlay-title" class="overlay hidden">
  <div class="sheet">
    <h2>Journey Home Japan</h2>
    <p>日本のどこかからスタートし、ランダムに選ばれた目的地(駅・空港・港)を目指す旅ゲームです。<br>
    最短距離ではなく、道中の知らない場所の発見に価値があります。</p>
    <button class="primary" id="btn-continue">続きから</button>
    <button class="primary" id="btn-newgame">はじめから</button>
  </div>
</div>

<div id="overlay-result" class="overlay hidden">
  <div class="sheet">
    <h2>目的地に到着！🎉</h2>
    <p>今回の旅の記録です。</p>
    <div class="result-grid">
      <div class="k">クリア時間</div><div class="v" id="res-time">--</div>
      <div class="k">総移動距離</div><div class="v" id="res-distance">--</div>
      <div class="k">訪問地点数</div><div class="v" id="res-visited">--</div>
      <div class="k">訪問都道府県数</div><div class="v" id="res-prefectures">--</div>
      <div class="k">発見地点数</div><div class="v" id="res-discovered">--</div>
      <div class="k">獲得金額(所持金)</div><div class="v" id="res-money">--</div>
    </div>
    <p id="res-breakdown"></p>
    <button class="primary" id="btn-play-again">もう一度、別の場所から出発する</button>
  </div>
</div>

<div id="loading" class="hidden">読み込み中...</div>

<script src="lib/leaflet/leaflet.js"></script>
<script src="js/save.js"></script>
<script src="js/movement.js"></script>
<script src="js/game.js"></script>
<script src="js/map.js"></script>
<script src="js/main.js"></script>
</body>
</html>
